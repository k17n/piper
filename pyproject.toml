[project]
name = "jobtracker"
version = "0.1.0"
description = "Local job application tracker: Gmail + local LLM (Ollama) + Sankey funnel"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlmodel>=0.0.22",
    "pydantic>=2.7",
    "rapidfuzz>=3.9",
    "ollama>=0.4",
    "google-api-python-client>=2.130",
    "google-auth-oauthlib>=1.2",
    "apscheduler>=3.10,<4",
    "pywebview>=5.1",
]

[project.scripts]
jobtracker = "jobtracker.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27", # required by fastapi.testclient
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobtracker"]
artifacts = ["src/jobtracker/static"]

[tool.pytest.ini_options]
testpaths = ["tests"]
